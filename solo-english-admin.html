<title>英语教务 · Solo</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#F0F2F8;--card:#FFFFFF;--line:#E8ECF3;--text:#1B2230;--sub:#7A8497;
    --primary:#5B4FE8;--primary-soft:#EEEAFE;--primary-dark:#4A3FC9;
    --accent:#FF6B9D;--accent-soft:#FCE4EC;
    --green:#10B981;--green-soft:#D1FAE5;
    --red:#EF4444;--red-soft:#FEE2E2;
    --yellow:#F59E0B;--yellow-soft:#FEF3C7;
    --blue:#3B82F6;--blue-soft:#DBEAFE;
    --shadow:0 1px 3px rgba(20,30,60,.04),0 4px 12px rgba(20,30,60,.05);
    --shadow-md:0 4px 6px rgba(20,30,60,.04),0 10px 24px rgba(20,30,60,.06);
    --radius:16px;--radius-sm:10px;
    --sidebar-w:72px;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);}
  /* 布局：左侧导航 + 右侧内容 */
  .app{display:flex;min-height:100vh;background:var(--bg);}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
    background:linear-gradient(180deg,#FFFFFF 0%,#F8F9FE 100%);
    z-index:60;display:flex;flex-direction:column;align-items:center;
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    border-right:1px solid var(--line);}
  .sidebar .logo{width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,#FBCFE8,#F8B4D9);
    display:flex;align-items:center;justify-content:center;
    color:#9D174D;font-size:13px;font-weight:700;margin-bottom:20px;
    box-shadow:0 4px 12px rgba(248,180,217,.5);}
  .sidebar .nav-items{flex:1;display:flex;flex-direction:column;gap:4px;width:100%;align-items:center;}
  .sidebar .nav-btn{width:52px;padding:10px 0;border-radius:14px;
    border:none;background:transparent;color:#9CA3AF;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;cursor:pointer;transition:all .2s;font-weight:500;}
  .sidebar .nav-btn svg{width:22px;height:22px;}
  .sidebar .nav-btn:active{transform:scale(.92);}
  /* 每个导航按钮不同颜色 */
  .sidebar .nav-btn[data-page="dashboard"].active{background:#FCE4EC;color:#EC4899;}
  .sidebar .nav-btn[data-page="dashboard"].active svg{color:#EC4899;}
  .sidebar .nav-btn[data-page="schedule"].active{background:#DBEAFE;color:#3B82F6;}
  .sidebar .nav-btn[data-page="schedule"].active svg{color:#3B82F6;}
  .sidebar .nav-btn[data-page="attendance"].active{background:#D1FAE5;color:#10B981;}
  .sidebar .nav-btn[data-page="attendance"].active svg{color:#10B981;}
  .sidebar .nav-btn[data-page="classes"].active{background:#FEF3C7;color:#F59E0B;}
  .sidebar .nav-btn[data-page="classes"].active svg{color:#F59E0B;}
  .sidebar .nav-btn[data-page="more"].active{background:#EDE9FE;color:#8B5CF6;}
  .sidebar .nav-btn[data-page="more"].active svg{color:#8B5CF6;}
  .main-wrap{margin-left:var(--sidebar-w);flex:1;min-width:0;}
  header.top{position:sticky;top:0;z-index:50;background:rgba(240,242,248,.85);
    padding-top:calc(12px + env(safe-area-inset-top));
    backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
  header.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px;}
  header.top .sub{font-size:12px;color:var(--sub);}
  main{padding:12px 12px 24px;max-width:600px;margin:0 auto;}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
    border:none;margin-bottom:12px;}
  .card h3{margin:0 0 12px 0;font-size:15px;display:flex;align-items:center;gap:6px;font-weight:600;}
  .card h3 .dot{width:6px;height:6px;background:var(--primary);border-radius:50%;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .stat{padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--primary-soft),#F5F3FF);position:relative;overflow:hidden;}
  .stat .lbl{font-size:11px;color:var(--sub);margin-bottom:6px;font-weight:500;}
  .stat .val{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px;}
  .stat .unit{font-size:12px;color:var(--sub);font-weight:400;margin-left:2px;}
  .stat.green{background:linear-gradient(135deg,var(--green-soft),#ECFDF5);}
  .stat.green .val{color:var(--green);}
  .stat.orange{background:linear-gradient(135deg,#FFEEDE,#FFF6EE);}
  .stat.orange .val{color:#EA7C2C;}
  .stat.yellow{background:linear-gradient(135deg,var(--yellow-soft),#FFFBEB);}
  .stat.yellow .val{color:#D97706;}
  .stat.red{background:linear-gradient(135deg,var(--red-soft),#FEF2F2);}
  .stat.red .val{color:var(--red);}
  .stat.blue{background:linear-gradient(135deg,var(--blue-soft),#EFF6FF);}
  .stat.blue .val{color:var(--blue);}
  .stat.pink{background:linear-gradient(135deg,var(--accent-soft),#FDF2F8);}
  .stat.pink .val{color:var(--accent);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .row + .row{margin-top:8px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;
    padding:9px 16px;border-radius:var(--radius-sm);border:none;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;
    box-shadow:0 2px 8px rgba(91,79,232,.2);}
  .btn:active{transform:scale(.95);opacity:.9;}
  .btn.secondary{background:var(--primary-soft);color:var(--primary);box-shadow:none;}
  .btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none;}
  .btn.danger{background:linear-gradient(135deg,var(--red),#DC2626);box-shadow:0 2px 8px rgba(239,68,68,.2);}
  .btn.success{background:linear-gradient(135deg,var(--green),#059669);box-shadow:0 2px 8px rgba(16,185,129,.2);}
  .btn.sm{padding:6px 12px;font-size:12px;border-radius:8px;}
  .btn.block{width:100%;padding:13px;font-size:15px;}
  .tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;}
  .tag.primary{background:var(--primary-soft);color:var(--primary);}
  .tag.green{background:var(--green-soft);color:var(--green);}
  .tag.red{background:var(--red-soft);color:var(--red);}
  .tag.yellow{background:var(--yellow-soft);color:#D97706;}
  .tag.gray{background:#EEF1F6;color:var(--sub);}
  .tag.blue{background:var(--blue-soft);color:var(--blue);}
  .tag.pink{background:var(--accent-soft);color:var(--accent);}
  .list-item{padding:12px 0;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .list-item .top-line{display:flex;justify-content:space-between;align-items:center;}
  .list-item .name{font-weight:600;}
  .list-item .meta{font-size:12px;color:var(--sub);margin-top:3px;}
  .input, select, textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:var(--radius-sm);background:#fff;font-size:14px;font-family:inherit;color:var(--text);
    outline:none;transition:all .15s;}
  .input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:500;}
  .form-actions{display:flex;gap:8px;margin-top:16px;}
  .form-actions .btn{flex:1;}
  .empty{padding:30px 10px;text-align:center;color:var(--sub);font-size:13px;}
  .empty .ic{font-size:32px;margin-bottom:6px;opacity:.5;}
  .badge{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;
    background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 5px;margin-left:4px;}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;
    background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:500;}

  /* Schedule */
  .sched-week{display:grid;grid-template-columns:48px repeat(7,1fr);gap:2px;
    background:var(--line);border-radius:var(--radius-sm);overflow:hidden;font-size:11px;}
  .sched-week .hd{background:#fff;padding:6px 2px;text-align:center;font-weight:600;color:var(--sub);}
  .sched-week .hd.today{color:var(--primary);background:var(--primary-soft);}
  .sched-week .hcell{background:#F9FAFC;padding:4px 2px;text-align:center;color:var(--sub);font-size:11px;}
  .sched-week .cell{background:#fff;min-height:48px;padding:2px;position:relative;font-size:10px;}
  .sched-week .slot{background:var(--primary-soft);border-left:3px solid var(--primary);
    border-radius:6px;padding:3px 4px;color:var(--primary);font-size:10px;line-height:1.3;cursor:pointer;
    transition:all .15s;}
  .sched-week .slot:active{transform:scale(.95);}
  .sched-week .slot .nm{font-weight:600;display:block;}
  .sched-week .slot .tm{opacity:.75;}

  /* Drawer / Modal */
  .mask{position:fixed;inset:0;background:rgba(15,20,40,.5);z-index:100;
    display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
  .mask.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:600px;border-radius:24px 24px 0 0;
    padding:20px 18px 28px;max-height:88vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1);}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet h2{margin:0 0 4px 0;font-size:18px;font-weight:700;}
  .sheet .sheet-sub{color:var(--sub);font-size:13px;margin-bottom:16px;}
  .sheet .grab{width:40px;height:4px;background:#D8DEEA;border-radius:2px;margin:-8px auto 14px;}

  /* Switch */
  .switch{position:relative;display:inline-block;width:42px;height:24px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#D8DEEA;border-radius:24px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--primary);}
  .switch input:checked + .slider:before{transform:translateX(18px);}

  /* Att chip */
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:6px 10px;border-radius:8px;background:#EEF1F6;color:var(--sub);
    font-size:12px;cursor:pointer;border:1px solid transparent;}
  .chip.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary);}

  /* Toast */
  .toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);
    background:rgba(20,25,40,.92);color:#fff;padding:10px 16px;border-radius:10px;
    font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}

  /* Tabs (within page) */
  .tabs{display:flex;background:#EEF1F6;border-radius:10px;padding:3px;margin-bottom:12px;}
  .tabs button{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;
    font-size:13px;color:var(--sub);cursor:pointer;font-weight:500;}
  .tabs button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.05);}

  .divider{height:1px;background:var(--line);margin:12px 0;}
  .num{font-variant-numeric:tabular-nums;}
  .warn-bg{background:#FFF4D6 !important;color:#B67800 !important;}
  .danger-bg{background:#FFE5E7 !important;color:var(--red) !important;}

  /* page switch */
  .page{display:none;}
  .page.active{display:block;}

  .fab{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;
    box-shadow:0 6px 20px rgba(91,79,232,.4);
    font-size:26px;line-height:52px;text-align:center;cursor:pointer;z-index:40;
    max-width:calc(600px - 36px);}

  .seg{display:flex;gap:6px;}
  .seg .btn{flex:1;padding:8px;}

  .table{width:100%;border-collapse:collapse;font-size:13px;}
  .table th,.table td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);}
  .table th{font-size:12px;color:var(--sub);font-weight:500;}
  .table tr:last-child td{border-bottom:none;}
  .price-table th{background:#F4F6FB;}
  .price-table .group-row td{background:#F0F4FF;font-weight:600;color:var(--primary);}

  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:6px;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

  .qr-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .qr-item:last-child{border-bottom:none;}
  .qr-item .l{font-size:14px;}
  .qr-item .r{text-align:right;font-size:12px;color:var(--sub);}

  details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  details summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  details summary::-webkit-details-marker{display:none;}
  details[open]{box-shadow:var(--shadow);}
  details .body{padding-top:8px;}
  .muted{color:var(--sub);font-size:12px;}

  .balance-bar{height:6px;background:#EEF1F6;border-radius:3px;overflow:hidden;margin-top:4px;}
  .balance-bar .fill{height:100%;background:var(--primary);transition:width .3s;}
  .balance-bar .fill.low{background:var(--yellow);}
  .balance-bar .fill.crit{background:var(--red);}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo">Diane</div>
    <div class="nav-items">
      <button class="nav-btn active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12L12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
        首页
      </button>
      <button class="nav-btn" data-page="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        课表
      </button>
      <button class="nav-btn" data-page="attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        消课
      </button>
      <button class="nav-btn" data-page="classes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        班级
      </button>
      <button class="nav-btn" data-page="more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        更多
      </button>
    </div>
  </nav>
  <div class="main-wrap">
    <header class="top">
      <div>
        <h1 id="topTitle">教务</h1>
        <div class="sub" id="topDate"></div>
      </div>
      <div class="sub" id="topRight"></div>
    </header>
    <main id="main"></main>
  </div>
</div>

<div class="mask" id="mask">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============== Storage ============== */
const LS_KEY = 'solo_english_admin_v1';
const Store = {
  data: null,
  load(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){ this.data = JSON.parse(raw); return; }
    }catch(e){}
    this.data = this.seed();
    this.save();
  },
  save(){ localStorage.setItem(LS_KEY, JSON.stringify(this.data)); },
  reset(){ this.data = this.seed(); this.save(); },
  seed(){
    const today = new Date();
    const ymd = d => d.toISOString().slice(0,10);
    const dPlus = (n)=>{ const d=new Date(today); d.setDate(d.getDate()+n); return ymd(d); };
    return {
      version:1,
      settings:{ teacher:'Tina' },
      packages:[
        {id:'p1',name:'启蒙包',type:'启蒙45次',lessons:45,amount:22500,earlyBird:18000,note:'9单元·45次'},
        {id:'p2',name:'Power Up 1学期包',type:'PowerUp1学期15次',lessons:15,amount:9000,earlyBird:7500,note:'3单元/15次'},
        {id:'p3',name:'Power Up 2学期包',type:'PowerUp2学期15次',lessons:15,amount:9000,earlyBird:7500,note:'3单元/15次'},
        {id:'p4',name:'Power Up 3学期包',type:'PowerUp3学期15次',lessons:15,amount:9000,earlyBird:7500,note:'3单元/15次'},
        {id:'p5',name:'Power Up 4学期包',type:'PowerUp4学期15次',lessons:15,amount:9000,earlyBird:7500,note:'3单元/15次'},
        {id:'p6',name:'KET 进阶',type:'KET进阶18',lessons:18,amount:11700,earlyBird:9900,note:'第一阶段'},
        {id:'p7',name:'KET 强化',type:'KET强化18',lessons:18,amount:11700,earlyBird:9900,note:'第二阶段'},
        {id:'p8',name:'KET 冲刺',type:'KET冲刺12',lessons:12,amount:7800,earlyBird:6600,note:'第三阶段'},
        {id:'p9',name:'KET 全程包',type:'KET全程48',lessons:48,amount:31200,earlyBird:26400,note:'进阶+强化+冲刺'},
        {id:'p10',name:'自定义课包',type:'自定义课包',lessons:1,amount:0,earlyBird:0,note:'次数和价格自定'},
      ],
      students:[

const U = {
  id:()=> Math.random().toString(36).slice(2,9),
  fmtMoney:n=>'¥'+(n||0).toLocaleString('zh-CN'),
  fmtDate:s=>{ if(!s) return '-'; const d=new Date(s); return `${d.getMonth()+1}月${d.getDate()}日`; },
  ymd:d=>{ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; },
  weekday:s=>{ const d=new Date(s); return ['日','一','二','三','四','五','六'][d.getDay()]; },
  todayYmd(){ return U.ymd(new Date()); },
  startOfWeek(d=new Date()){
    const day=d.getDay(); const diff=d.getDate()-day;
    const r=new Date(d); r.setDate(diff); r.setHours(0,0,0,0); return r;
  },
  addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; },
  toast(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800);
  },
  escape(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
};

/* ============== Helpers ============== */
const D = Store.data;
const getStudent = id => D.students.find(s=>s.id===id);
const getClass = id => D.classes.find(c=>c.id===id);
const getPackage = id => D.packages.find(p=>p.id===id);
const getEnrollment = id => D.enrollments.find(e=>e.id===id);
const getStudentEnrollments = sid => D.enrollments.filter(e=>e.studentId===sid);
const getStudentRemaining = sid => getStudentEnrollments(sid).reduce((a,e)=>a+e.remaining,0);
const getStudentUsed = sid => getStudentEnrollments(sid).reduce((a,e)=>a+e.used,0);

function detectConflict(weekday,time,duration,excludeClassId){
  // 返回冲突的班级
  return D.classes.find(c=>{
    if(c.id===excludeClassId) return false;
    if(c.weekday!==weekday) return false;
    // overlap?
    return timesOverlap(c.time,c.duration,time,duration);
  });
}
function timesOverlap(t1,d1,t2,d2){
  const a1=toMin(t1), a2=a1+d1;
  const b1=toMin(t2), b2=b1+d2;
  return a1<b2 && b1<a2;
}
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fromMin(m){ const h=Math.floor(m/60),mm=m%60; return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }

function statusOfClass(c){
  const cnt=c.studentIds.length;
  if(cnt>=c.maxStudents) return {label:'满班',cls:'red'};
  if(c.waitlist && c.waitlist.length>0) return {label:`候补${c.waitlist.length}`,cls:'yellow'};
  if(cnt>=c.maxStudents-2) return {label:'快满',cls:'yellow'};
  return {label:'招生中',cls:'green'};
}

/* ============== 班级排课计算（核心） ==============
   根据班级的开课日期 + 每周固定(weekday) + 调课记录(overrides)
   生成完整 N 节课的日期列表。N = 关联课程包的 lessons 数。
   overrides 结构: {fromDate:'2026-08-05', toDate:'2026-08-07', note:'调课'}
   表示把 8/5 这节调到 8/7。
*/
function getClassLessonCount(c){
  // 一对一/一对二班级：使用手动填的 totalLessons
  if(c.classType==='private1'||c.classType==='private2'){
    return c.totalLessons||10;
  }
  // 常规班：使用课程包次数
  if(c.packageId){
    const p=getPackage(c.packageId);
    if(p) return p.lessons;
  }
  return c.totalLessons||10; // 兜底
}
function getClassSchedule(c){
  const total = getClassLessonCount(c);
  const start = c.startDate ? new Date(c.startDate) : new Date();
  start.setHours(0,0,0,0);
  // 找到开课日期当天或之后第一个 weekday 匹配的日子作为第1节
  // 如果开课日期本身就是 weekday，就用它
  let firstDate = new Date(start);
  // 向后找到第一个匹配 weekday 的日期
  while(firstDate.getDay() !== c.weekday){
    firstDate = U.addDays(firstDate,1);
  }
  // 生成 total 节课的基础日期（每周一节）
  const lessons = [];
  for(let i=0;i<total;i++){
    const d = U.addDays(firstDate, i*7);
    lessons.push({
      idx: i+1,
      originalDate: U.ymd(d),
      date: U.ymd(d), // 可能被调课覆盖
      time: c.time,
      moved: false
    });
  }
  // 应用调课 overrides
  const moves = c.overrides||[];
  moves.forEach(mv=>{
    if(mv.fromDate && mv.toDate){
      const lesson = lessons.find(l=>l.originalDate===mv.fromDate);
      if(lesson){
        lesson.date = mv.toDate;
        lesson.time = mv.time || c.time;
        lesson.moved = true;
        lesson.note = mv.note||'';
      } else {
        // 如果原日期不在列表里（比如已经调过），尝试找 date 匹配的
        const lesson2 = lessons.find(l=>l.date===mv.fromDate);
        if(lesson2){
          lesson2.date = mv.toDate;
          lesson2.time = mv.time || c.time;
          lesson2.moved = true;
          lesson2.note = mv.note||'';
        }
      }
    }
  });
  // 按实际日期排序
  lessons.sort((a,b)=> a.date.localeCompare(b.date));
  return lessons;
}
// 判断某日期是否有课（用于周课表/首页）
function classHasLessonOnDate(c, ymd){
  const lessons = getClassSchedule(c);
  return lessons.some(l=>l.date===ymd);
}

Pages.schedule = function(){
  const start = U.startOfWeek(new Date());
  const days = Array.from({length:7},(_,i)=>U.addDays(start,i));

  // 用新的排课逻辑：判断每天有哪些班级有课
  function getClassesOnDate(date){
    const ymd = U.ymd(date);
    return D.classes.filter(c=>classHasLessonOnDate(c,ymd))
      .map(c=>{
        // 找到当天这节课的信息（可能被调课改过时间）
        const lessons = getClassSchedule(c);
        const lesson = lessons.find(l=>l.date===ymd);
        return {...c, time: (lesson&&lesson.time)||c.time, moved: lesson&&lesson.moved};
      })
      .sort((a,b)=> toMin(a.time)-toMin(b.time));
  }

  const weekClasses = days.map(d=>({date:d, classes:getClassesOnDate(d)}));
  const usedSlots = new Set();
  weekClasses.forEach(({classes})=>{
    classes.forEach(c=>{
      const m = toMin(c.time);
      const slot = Math.floor(m/60)*60;
      usedSlots.add(slot);
    });
  });
  const sortedSlots = [...usedSlots].sort((a,b)=>a-b);

  let html = `
  <div class="card">
    <div class="row" style="margin-bottom:8px;">
      <div><strong>本周课表</strong> <span class="muted">${U.fmtDate(U.ymd(start))} – ${U.fmtDate(U.ymd(U.addDays(start,6)))}</span></div>
      <button class="btn sm" onclick="openAddClass()">+ 新建班级</button>
    </div>
    ${sortedSlots.length===0 ? '<div class="empty" style="padding:24px;">本周没有排课</div>' : `
    <div class="sched-week" style="grid-template-columns:48px repeat(7,1fr);">
      <div class="hd"></div>
      ${days.map((d,i)=>{
        const isToday = U.ymd(d)===U.todayYmd();
        return `<div class="hd ${isToday?'today':''}">周${['日','一','二','三','四','五','六'][i]}<br>${d.getMonth()+1}/${d.getDate()}</div>`;
      }).join('')}
      ${sortedSlots.map(slot=>{
        const slotLabel = fromMin(slot);
        let row=`<div class="hcell">${slotLabel}</div>`;
        for(let i=0;i<7;i++){
          const dayClasses = weekClasses[i].classes.filter(c=>{
            const m=toMin(c.time);
            return m>=slot && m<slot+60;
          });
          row += `<div class="cell">${dayClasses.map(c=>{
            const nm = c.name.length>6 ? c.name.slice(0,6)+'…' : c.name;
            const movedTag = c.moved ? `<span style="color:var(--accent)">●</span>` : '';
            return `<div class="slot" onclick="openClassSchedule('${c.id}')" title="${U.escape(c.name)}">
              <span class="nm">${U.escape(nm)} ${movedTag}</span>
              <span class="tm">${c.time}·${c.studentIds.length}${c.maxStudents?'/'+c.maxStudents:''}</span>
            </div>`;
          }).join('')||''}</div>`;
        }
        return row;
      }).join('')}
    </div>`}
    <div class="legend">
      <span><i style="background:#E7EDFF;border:1px solid #2D5BFF"></i>点击班级查看课表</span>
      <span><i style="color:var(--accent)">●</i>已调课</span>
    </div>
  </div>
  <div class="card">
    <h3><span class="dot"></span>全部班级</h3>
    ${D.classes.map(c=>{
      const st=statusOfClass(c);
      const p = c.packageId?getPackage(c.packageId):null;
      return `
      <div class="list-item">
        <div class="top-line">
          <div>
            <div class="name">${U.escape(c.name)} <span class="tag ${st.cls}">${st.label}</span></div>
            <div class="meta">周${['日','一','二','三','四','五','六'][c.weekday]} ${c.time} · ${c.duration}分钟 · ${c.level}${c.classType==='private1'?' · 一对一':c.classType==='private2'?' · 一对二':''}${c.classType!=='regular'&&c.totalLessons?` · ${c.totalLessons}次`:(p?` · ${p.lessons}次`:'')}</div>

  return html;
};

Pages.statistics = function(){

Pages.income = function(){
  const today = new Date();
  const ms = new Date(today.getFullYear(),today.getMonth(),1);
  const me = new Date(today.getFullYear(),today.getMonth()+1,1);
  const monthIncome = D.payments.filter(p=>{const d=new Date(p.date); return d>=ms && d<me;}).reduce((a,p)=>a+p.paidAmount,0);
  const totalIncome = D.payments.reduce((a,p)=>a+p.paidAmount,0);
  const pending = D.payments.filter(p=>p.paidAmount<p.totalAmount);

  // by student
  const byStudent = {};
  D.payments.forEach(p=>{ byStudent[p.studentId]=(byStudent[p.studentId]||0)+p.paidAmount; });
  // by class (paid -> enrollment -> student -> classes)
  const byClass = {};
  D.payments.forEach(p=>{
    const s=getStudent(p.studentId);
    if(!s) return;
    const cls = D.classes.filter(c=>c.studentIds.includes(s.id));
    cls.forEach(c=>{ byClass[c.id]=(byClass[c.id]||0)+p.paidAmount/cls.length; });
  });

  return `
  <div class="card">
    <h3><span class="dot"></span>收入概览</h3>
    <div class="grid2">
      <div class="stat green"><div class="lbl">本月收入</div><div class="val num">${U.fmtMoney(monthIncome)}</div></div>

      <div class="stat orange"><div class="lbl">待缴余款</div><div class="val num">${U.fmtMoney(pending.reduce((a,p)=>a+(p.totalAmount-p.paidAmount),0))}</div></div>
      <div class="stat yellow"><div class="lbl">缴费笔数</div><div class="val num">${D.payments.length}</div></div>

let currentPage = 'dashboard';
function navigate(p, replace){
  currentPage = p;
  document.getElementById('main').innerHTML = Pages[p]();
  [...document.querySelectorAll('.nav-btn')].forEach(t=>t.classList.toggle('active',t.dataset.page===p || (p==='students'&&t.dataset.page==='more') || (p==='statistics'&&t.dataset.page==='more') || (p==='income'&&t.dataset.page==='more') || (p==='prices'&&t.dataset.page==='more') || (p==='classSchedules'&&t.dataset.page==='more')));
  // update title
  const titleMap={dashboard:'首页',schedule:'周课表',attendance:'消课',classes:'班级',students:'学生',statistics:'课时统计',income:'收入',prices:'价格表',classSchedules:'班级课表',more:'更多'};
  document.getElementById('topTitle').textContent = titleMap[p]||'教务';
  document.getElementById('topDate').textContent = '';
  document.getElementById('topRight').textContent = '';
  window.scrollTo(0,0);
}

document.querySelectorAll('.nav-btn').forEach(t=>{

function saveNewClass(){
  const name=document.getElementById('cName').value.trim();
  if(!name){U.toast('请输入班级名称');return;}
  const weekday=+document.getElementById('cWd').value;
  const time=document.getElementById('cTime').value;
  const duration=+document.getElementById('cDur').value;
  const level=document.getElementById('cLevel').value;
  const classType=document.getElementById('cType').value;
  const maxStudents=classType==='private1'?1:classType==='private2'?2:(+document.getElementById('cMax').value||6);
  const packageId=classType==='regular'?(document.getElementById('cPkg').value||''):'';
  const totalLessons=classType!=='regular'?(+document.getElementById('cLessons').value||10):0;
  const startDate=document.getElementById('cStart').value||U.todayYmd();
  const conflict = detectConflict(weekday,time,duration,null);
  if(conflict){
    if(!confirm(`与班级「${conflict.name}」时间冲突（周${['日','一','二','三','四','五','六'][conflict.weekday]} ${conflict.time}）仍要保存？`)) return;

  const cls={id:U.id(),name,level,packageId,weekday,time,duration,maxStudents,startDate,studentIds:[],status:'招生中',note:'',classType:classType,totalLessons:totalLessons};
  D.classes.push(cls);
  Store.save(); closeSheet(); navigate('schedule'); U.toast('已创建');
}

/* ============== Class schedule detail (班级课表 + 调课) ============== */
function openClassSchedule(cid){
  renderClassScheduleSheet(cid);
}
function renderClassScheduleSheet(cid){
  const c=getClass(cid); if(!c) return;
  const p = c.packageId?getPackage(c.packageId):null;
  const lessons = getClassSchedule(c);
  const todayStr = U.todayYmd();

  openSheet(`
    <h2>${U.escape(c.name)}</h2>
    <div class="sheet-sub">周${['日','一','二','三','四','五','六'][c.weekday]} ${c.time} · ${c.duration}分钟 · ${(c.classType==='private1'?'一对一':c.classType==='private2'?'一对二':'常规班')} · ${(c.classType!=='regular')?(c.totalLessons+'次课'):(p?p.lessons+'次课':'未绑定课程包')} · ${c.studentIds.length}人</div>
    <h3 style="font-size:14px;margin:0 0 8px;">全部课程（${lessons.length}节）</h3>
    <div style="max-height:48vh;overflow-y:auto;">
      ${lessons.map((l,i)=>{
        const d=new Date(l.date);
        const isToday = l.date===todayStr;
        const isPast = l.date<todayStr;
        const movedTag = l.moved?'<span class="tag yellow">已调</span>':'';
        return `<div class="list-item">
          <div class="top-line">
            <div>
              <div class="name">第${l.idx}节 · ${d.getMonth()+1}月${d.getDate()}日 · 周${['日','一','二','三','四','五','六'][d.getDay()]} ${isToday?'<span class="tag green">今天</span>':''} ${movedTag}</div>
              <div class="meta">${l.time}${l.note?' · '+U.escape(l.note):''}${isPast?' · 已上':''}</div>
            </div>
            <div style="display:flex;gap:4px;">
              <button class="btn sm ghost" onclick="openMoveLesson('${cid}','${l.originalDate}','${l.date}')">调课</button>
              <button class="btn sm secondary" onclick="openQuickAttend('${cid}','${l.date}')">消课</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
    ${(c.overrides||[]).length>0?`
    <div class="divider"></div>
    <h3 style="font-size:14px;margin:0 0 8px;">调课记录</h3>
    ${(c.overrides||[]).map(o=>{
      const fd=new Date(o.fromDate), td=new Date(o.toDate);
      return `<div class="list-item">
        <div class="top-line">
          <div>
            <div class="name">${fd.getMonth()+1}月${fd.getDate()}日 → ${td.getMonth()+1}月${td.getDate()}日</div>
            <div class="meta">${o.note||''}</div>
          </div>
          <button class="btn sm danger" onclick="removeMove('${cid}','${o.fromDate}')">撤销</button>
        </div>
      </div>`;
    }).join('')}
    `:''}
    <div class="form-actions">
      <button class="btn secondary" onclick="closeSheet()">关闭</button>
      <button class="btn ghost" onclick="openEditClass('${cid}')">编辑班级</button>
    </div>
  `);
}
// 调课：把某节课从原日期调到新日期
function openMoveLesson(cid, originalDate, currentDate){
  const c=getClass(cid);
  openSheet(`
    <h2>调课</h2>
    <div class="sheet-sub">${U.escape(c.name)} · 原日期 ${originalDate}${originalDate!==currentDate?`（当前 ${currentDate}）`:''}</div>
    <div class="field"><label>调到哪一天</label><input class="input" id="mvToDate" type="date" value="${currentDate}"/></div>
    <div class="field"><label>上课时间（可选，留空用默认）</label><input class="input" id="mvTime" type="time" value="${c.time}"/></div>
    <div class="field"><label>备注（可选）</label><input class="input" id="mvNote" placeholder="如：学生请假补课、节假日顺延"/></div>
    <div class="form-actions">
      <button class="btn secondary" onclick="closeSheet();renderClassScheduleSheet('${cid}')">取消</button>
      <button class="btn" onclick="saveMoveLesson('${cid}','${originalDate}','${currentDate}')">确认调课</button>
    </div>
  `);
}
function saveMoveLesson(cid, originalDate, currentDate){
  const c=getClass(cid);
  const toDate = document.getElementById('mvToDate').value;
  const time = document.getElementById('mvTime').value;
  const note = document.getElementById('mvNote').value;
  if(!toDate){U.toast('请选目标日期');return;}
  if(toDate===currentDate){U.toast('日期相同，无需调课');return;}
  c.overrides = c.overrides||[];
  // 如果之前有基于 originalDate 的调课，先移除
  c.overrides = c.overrides.filter(o=>o.fromDate!==originalDate);
  c.overrides.push({fromDate:originalDate, toDate, time, note});
  Store.save(); closeSheet();
  renderClassScheduleSheet(cid);
  U.toast('已调课');
}
function removeMove(cid, fromDate){
  const c=getClass(cid);
  c.overrides = (c.overrides||[]).filter(o=>o.fromDate!==fromDate);
  Store.save(); closeSheet();
  renderClassScheduleSheet(cid);
  U.toast('已撤销调课');
}

function delStudent(id){
  if(!confirm('删除该学生及其所有报名/缴费/消课记录？')) return;
  D.students=D.students.filter(s=>s.id!==id);
  D.enrollments=D.enrollments.filter(e=>e.studentId!==id);
  D.payments=D.payments.filter(p=>p.studentId!==id);
  D.attendances=D.attendances.filter(a=>a.studentId!==id);
  D.classes.forEach(c=>{c.studentIds=c.studentIds.filter(x=>x!==id); if(c.waitlist) c.waitlist=c.waitlist.filter(x=>x!==id);});

function toggleClassStudent(cid,sid,on){

  Store.save();
}

/* ============== Quick attendance (per class) ============== */
function openQuickAttend(cid,date){
  const c=getClass(cid);
  const students = c.studentIds.map(getStudent).filter(Boolean);
  if(students.length===0){U.toast('班级暂无学员');return;}
  // pre-fill existing records for this date
  const existing = D.attendances.filter(a=>a.classId===cid && a.date===date);

  // 散课班级：只记出勤 + 金额，不扣课时
  if(c.isDropIn){
    openSheet(`
      <h2>散课消课 · ${U.escape(c.name)}</h2>
      <div class="sheet-sub">${date} · ${U.escape(c.level)} · 每次 ${U.fmtMoney(c.dropInPrice||0)}（出席自动记一笔收入）</div>
      <div id="attList">
        ${students.map(s=>{
          const ex=existing.find(a=>a.studentId===s.id);
          const status = ex? ex.attendance : '出席';
          const amt = ex? (ex.amount||c.dropInPrice||0) : (c.dropInPrice||0);
          return `<div class="list-item">
            <div class="top-line">
              <div>
                <div class="name">${U.escape(s.name)}</div>
                <div class="meta">出勤状态：${status} · 金额 ¥<input type="number" style="width:70px;display:inline-block;padding:2px 4px;" class="input" data-sid="${s.id}" data-role="amt" value="${amt}"/></div>
              </div>
            </div>
            <div class="chips" style="margin-top:6px;" data-sid="${s.id}">
              <span class="chip ${status==='出席'?'on':''}" onclick="setDropStatus(this,'出席')">到</span>
              <span class="chip ${status==='请假'?'on':''}" onclick="setDropStatus(this,'请假')">请假</span>
              <span class="chip ${status==='缺席'?'on':''}" onclick="setDropStatus(this,'缺席')">缺席</span>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="form-actions">
        <button class="btn secondary" onclick="closeSheet()">取消</button>
        <button class="btn" onclick="commitDropInAttend('${cid}','${date}')">确认提交</button>
      </div>
    `);
    return;
  }

  openSheet(`
    <h2>消课 · ${U.escape(c.name)}</h2>
    <div class="sheet-sub">${date} · 勾选本节扣课的学生，未勾选视为请假/缺席不扣</div>
    <div class="field" style="display:flex;gap:6px;">
      <button class="btn sm" onclick="setAllAttend(true)">整班到</button>
      <button class="btn sm secondary" onclick="setAllAttend(false)">整班不到</button>
    </div>
    <div id="attList">
      ${students.map(s=>{
        const ex=existing.find(a=>a.studentId===s.id);
        const r=getStudentRemaining(s.id);
        const status = ex? ex.attendance : '出席';
        const deduct = ex? ex.deduct : true;
        return `<div class="list-item">
          <div class="top-line">
            <div>
              <div class="name">${U.escape(s.name)} <span class="tag ${r<=3?'yellow':'gray'}">剩${r}</span></div>
              <div class="meta">本节扣课：${deduct?'<b style="color:var(--green)">是</b>':'<b style="color:var(--sub)">否</b>'}</div>
            </div>
            <label class="switch"><input type="checkbox" data-sid="${s.id}" data-deduct="${deduct?1:0}" data-status="${status}" ${deduct?'checked':''} onchange="rowAttendChange(this,'${s.id}',${r})"><span class="slider"></span></label>
          </div>
          <div class="chips" style="margin-top:6px;">
            <span class="chip ${status==='出席'?'on':''}" onclick="setAttStatus(this,'${s.id}','出席')">到</span>
            <span class="chip ${status==='请假'?'on':''}" onclick="setAttStatus(this,'${s.id}','请假')">请假</span>
            <span class="chip ${status==='缺席'?'on':''}" onclick="setAttStatus(this,'${s.id}','缺席')">缺席</span>
            <span class="chip" onclick="setMakeUp('${s.id}')">标为补课</span>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="form-actions">
      <button class="btn secondary" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="commitClassAttend('${cid}','${date}')">确认提交</button>
    </div>
  `);
}
function setDropStatus(el,status){
  const wrap=el.parentElement;
  [...wrap.children].forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  wrap.dataset.status=status;
}
function commitDropInAttend(cid,date){
  const c=getClass(cid);
  // 清除当天已有记录
  const oldRecs = D.attendances.filter(a=>a.classId===cid && a.date===date);
  const oldIds = new Set(oldRecs.map(a=>a.id));
  D.attendances = D.attendances.filter(a=>!oldIds.has(a.id));
  // 同时清除这些散课记录对应的缴费（按 note 标识）
  D.payments = D.payments.filter(p=>!(p.enrollmentId==='' && p.date===date && p.note && p.note.indexOf(`散课·${c.name}`)===0 && oldRecs.some(a=>a.studentId===p.studentId)));

  let attended=0, revenue=0;
  document.querySelectorAll('#attList .chips').forEach(wrap=>{
    const sid=wrap.dataset.sid;
    const status = wrap.dataset.status || '出席';
    const amtInput = document.querySelector(`#attList input[data-sid="${sid}"][data-role="amt"]`);
    const amt = +(amtInput && amtInput.value) || 0;
    D.attendances.push({id:U.id(),date,classId:cid,studentId:sid,attendance:status,deduct:false,makeUp:false,isDropIn:true,amount:amt});
    if(status==='出席' && amt>0){
      attended++; revenue+=amt;
      // 自动生成一条缴费记录
      D.payments.push({id:U.id(),studentId:sid,enrollmentId:'',packageName:`散课·${c.level}`,totalAmount:amt,paidAmount:amt,installments:1,date,note:`散课·${c.name}`});
    }
  });
  Store.save(); closeSheet();
  U.toast(`散课已记录：出席 ${attended} 人，收入 ${U.fmtMoney(revenue)}`);
  navigate(currentPage);
}
function setAllAttend(flag){
  document.querySelectorAll('#attList input[type=checkbox]').forEach(cb=>{
    cb.checked=flag; cb.dataset.deduct=flag?1:0;
  });
}
function rowAttendChange(cb,sid,remain){
  cb.dataset.deduct = cb.checked?1:0;
}
function setAttStatus(el,sid,status){
  const wrap=el.parentElement;
  [...wrap.children].forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const card=wrap.parentElement;
  const toggle=card.querySelector('input[type=checkbox]');
  toggle.dataset.status=status;
  // 请假时默认不扣课（除非用户手动开启）
  if(status==='请假'){
    toggle.checked=false; toggle.dataset.deduct=0;
    const meta = card.querySelector('.meta');
    meta.innerHTML='本节扣课：<b style="color:var(--sub)">否</b>（请假）';
  } else if(status==='出席'){
    toggle.checked=true; toggle.dataset.deduct=1;
    const meta = card.querySelector('.meta');
    meta.innerHTML='本节扣课：<b style="color:var(--green)">是</b>';
  } else if(status==='缺席'){
    // 缺席按老师习惯通常不扣课（学生没来）
    toggle.checked=false; toggle.dataset.deduct=0;
    const meta = card.querySelector('.meta');
    meta.innerHTML='本节扣课：<b style="color:var(--sub)">否</b>（缺席）';
  }
}
function setMakeUp(sid){
  // mark this student in this class as make-up (visual only, hint applied at commit)
  const card=event.target.closest('.list-item');
  event.target.classList.toggle('on');
  const t=card.querySelector('input[type=checkbox]');
  t.dataset.makeup = event.target.classList.contains('on')?1:0;
}
function commitClassAttend(cid,date){
  const c=getClass(cid);
  const inputs=[...document.querySelectorAll('#attList input[type=checkbox]')];
  // remove existing records for this class+date
  D.attendances = D.attendances.filter(a=>!(a.classId===cid && a.date===date));
  let deducted=0, madeUp=0;
  inputs.forEach(cb=>{
    const sid=cb.dataset.sid;
    const deduct = cb.dataset.deduct==='1';
    const status = cb.dataset.status || (deduct?'出席':'请假');
    const makeUp = cb.dataset.makeup==='1';
    D.attendances.push({id:U.id(),date,classId:cid,studentId:sid,attendance:status,deduct,makeUp});
    if(deduct){
      // decrement student remaining (FIFO across enrollments)
      const ens=getStudentEnrollments(sid);
      let need=1;
      for(const e of ens){
        if(need<=0) break;
        const take=Math.min(e.remaining,need);
        e.remaining-=take; e.used+=take; need-=take;
        deducted++;
      }
    }
    if(makeUp) madeUp++;
  });
  Store.save(); closeSheet();
  U.toast(`已提交：扣课 ${deducted} 人${madeUp?`，补课 ${madeUp} 人`:''}`);
  navigate(currentPage);
}
function quickByClass(){
  const cid=document.getElementById('clsSel').value;
  const date=document.getElementById('clsDate').value;
  closeSheet();
  setTimeout(()=>openQuickAttend(cid,date),200);
}

        ${D.classes.filter(c=>c.studentIds.includes(sid)).map(c=>`<option value="${c.id}">${U.escape(c.name)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>出勤</label>
      <div class="chips">
        <span class="chip on" data-st="出席">到</span>
        <span class="chip" data-st="请假">请假</span>
        <span class="chip" data-st="缺席">缺席</span>
      </div>

function commitSingleAttend(sid,date){
  const cls=document.getElementById('sglCls').value;
  const deduct=document.getElementById('sglDeduct').checked;
  const makeUp=document.getElementById('sglMakeUp').checked;
  const status=document.querySelector('.chip.on[data-st]').dataset.st;
  D.attendances.push({id:U.id(),date,classId:cls,studentId:sid,attendance:status,deduct,makeUp});
  if(deduct){
    const ens=getStudentEnrollments(sid); let need=1;
    for(const e of ens){
      if(need<=0) break;
      const take=Math.min(e.remaining,need);
      e.remaining-=take; e.used+=take; need-=take;
    }
  }
  Store.save(); closeSheet(); navigate(currentPage); U.toast('已记录');
}

/* ============== Enrollment / 续费 ============== */
function quickEnroll(sid){
  const s=getStudent(sid);
  openSheet(`
    <h2>报名 · ${U.escape(s.name)}</h2>
    <div class="sheet-sub">为该学生报名一个课程包，自动加课时</div>
    <div class="field"><label>选择课程包</label>
      <select class="input" id="enPkg">
        ${D.packages.map(p=>`<option value="${p.id}">${U.escape(p.name)} · ${p.lessons}次 · ${p.amount>0?U.fmtMoney(p.amount):'价格自定'}${p.earlyBird>0?'（早鸟'+U.fmtMoney(p.earlyBird)+'）':''}</option>`).join('')}
      </select>
    </div>
    <div class="grid2">
      <div class="field"><label>报名日期</label><input class="input" id="enDate" type="date" value="${U.todayYmd()}"/></div>
      <div class="field"><label>本次实收</label><input class="input" id="enPaid" type="number" value="0"/></div>
    </div>
    <div class="grid2">
      <div class="field"><label>总金额</label><input class="input" id="enTotal" type="number" value="0"/></div>
      <div class="field"><label>备注</label><input class="input" id="enNote" placeholder="选填"/></div>
    </div>
    <div class="form-actions">
      <button class="btn secondary" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="commitEnroll('${sid}')">确认报名</button>
    </div>
  `);
  // auto-fill total based on package

function commitEnroll(sid){
  const pid=document.getElementById('enPkg').value;
  const p=getPackage(pid);
  const date=document.getElementById('enDate').value;
  const total=+document.getElementById('enTotal').value||p.amount;
  const paid=+document.getElementById('enPaid').value;
  const note=document.getElementById('enNote').value;
  const eid=U.id();
  D.enrollments.push({id:eid,studentId:sid,packageId:pid,totalLessons:p.lessons,remaining:p.lessons,used:0,enrolledAt:date});
  D.payments.push({id:U.id(),studentId:sid,enrollmentId:eid,packageName:p.name,totalAmount:total,paidAmount:paid,installments:1,date,note});
  Store.save(); closeSheet(); navigate('students'); U.toast('已报名并加课时');
}

/* ============== Payment ============== */
function openAddPayment(){
  openSheet(`
    <h2>新增缴费</h2>
    <div class="field"><label>学生</label>
      <select class="input" id="payStu">${D.students.map(s=>`<option value="${s.id}">${U.escape(s.name)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>项目名称</label><input class="input" id="payPkg" placeholder="如：Power Up 1学期包 / 单次课"/></div>
    <div class="grid2">
      <div class="field"><label>总金额</label><input class="input" id="payTotal" type="number"/></div>
      <div class="field"><label>本次实收</label><input class="input" id="payPaid" type="number"/></div>
    </div>
    <div class="field"><label>日期</label><input class="input" id="payDate" type="date" value="${U.todayYmd()}"/></div>
    <div class="form-actions">
      <button class="btn secondary" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="commitPayment()">保存</button>

}
function commitPayment(){
  const sid=document.getElementById('payStu').value;
  const pkgName=document.getElementById('payPkg').value||'自由缴费';
  const total=+document.getElementById('payTotal').value||0;
  const paid=+document.getElementById('payPaid').value||0;
  const date=document.getElementById('payDate').value;
  D.payments.push({id:U.id(),studentId:sid,enrollmentId:'',packageName:pkgName,totalAmount:total,paidAmount:paid,installments:1,date});
  Store.save(); closeSheet(); navigate('income'); U.toast('已记录');
}
function recordPayment(pid){
  const p=D.payments.find(x=>x.id===pid);
  openSheet(`
    <h2>记录缴费</h2>
    <div class="sheet-sub">${U.escape(p.packageName)} · 已付 ${U.fmtMoney(p.paidAmount)} / ${U.fmtMoney(p.totalAmount)}</div>
    <div class="field"><label>本次金额</label><input class="input" id="rpAmt" type="number" value="${p.totalAmount-p.paidAmount}"/></div>
    <div class="field"><label>日期</label><input class="input" id="rpDate" type="date" value="${U.todayYmd()}"/></div>
    <div class="form-actions">
      <button class="btn secondary" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="doRecordPayment('${pid}')">确认</button>
    </div>
  `);
}
function doRecordPayment(pid){
  const p=D.payments.find(x=>x.id===pid);
  const amt=+document.getElementById('rpAmt').value;
  const date=document.getElementById('rpDate').value;
  p.paidAmount=Math.min(p.totalAmount,p.paidAmount+amt);
  D.payments.push({id:U.id(),studentId:p.studentId,enrollmentId:p.enrollmentId,packageName:p.packageName+'（续缴）',totalAmount:amt,paidAmount:amt,installments:1,date});
  Store.save(); closeSheet(); navigate('income'); U.toast('已记录');
}

/* ============== Package CRUD ============== */
function openAddPackage(){
  openSheet(`
    <h2>新增课程包</h2>

    <div class="field"><label>类型</label>

        <option>PowerUp3学期15次</option><option>PowerUp4学期15次</option>
        <option>KET进阶18</option><option>KET强化18</option><option>KET冲刺12</option>
        <option>自定义课包</option>

function onPkgTypeChange(prefix){
  const typeEl=document.getElementById(prefix+'Type');
  if(!typeEl)return;
  const isCustom=typeEl.value==='自定义课包';
  const lesEl=document.getElementById(prefix+'Les');
  const amtEl=document.getElementById(prefix+'Amt');
  const ebEl=document.getElementById(prefix+'EB');

    if(lesEl){lesEl.value='';lesEl.placeholder='填次数';}
    if(amtEl){amtEl.value='';amtEl.placeholder='填价格';}

function savePackage(){
  D.packages.push({
    id:U.id(),
    name:document.getElementById('apName').value,
    type:document.getElementById('apType').value,
    lessons:+document.getElementById('apLes').value,

function openEditPackage(id){

    <div class="field"><label>类型</label><input class="input" id="epType" value="${U.escape(p.type)}"/></div>

function updatePackage(id){
  const p=getPackage(id);
  p.name=document.getElementById('epName').value;
  p.type=document.getElementById('epType').value;
  p.lessons=+document.getElementById('epLes').value;
  p.amount=+document.getElementById('epAmt').value;
  p.earlyBird=+document.getElementById('epEB').value;
  p.note=document.getElementById('epNote').value;

function delPackage(id){
  if(!confirm('删除该课程包？已有报名不受影响')) return;
  D.packages=D.packages.filter(p=>p.id!==id);
  Store.save(); navigate('prices'); U.toast('已删除');

/* ============== Data export/import ============== */
function exportData(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`教务数据_${U.todayYmd()}.json`;
  a.click();
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(!obj.students||!obj.classes) throw new Error('格式错误');
      if(!confirm('导入将覆盖当前所有数据，确定？')) return;
      D.students=obj.students; D.classes=obj.classes; D.enrollments=obj.enrollments||[];
      D.attendances=obj.attendances||[]; D.payments=obj.payments||[]; D.packages=obj.packages||[];
      D.schedules=obj.schedules||[]; D.settings=obj.settings||{teacher:'Tina'};
      Store.save(); navigate('dashboard'); U.toast('已导入');
    }catch(err){U.toast('导入失败：'+err.message);}
  };
  r.readAsText(f);
}
function confirmReset(){
  if(!confirm('重置为初始示例数据？当前数据将丢失')) return;
  Store.reset(); navigate('dashboard'); U.toast('已重置');
}

// PWA standalone 检测
if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true){
  document.body.classList.add('pwa');
}

// Service Worker：缓存当前页面，实现离线可用
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE='solo-english-v1';
    self.addEventListener('install',e=>{
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c=>c.addAll([self.registration.scope])));
    });
    self.addEventListener('activate',e=>{ e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET') return;
      e.respondWith(
        caches.match(e.request).then(r=> r || fetch(e.request).then(resp=>{
          const copy=resp.clone();
          caches.open(CACHE).then(c=>c.put(e.request,copy)).catch(()=>{});
          return resp;
        }).catch(()=> caches.match(self.registration.scope)))
      );
    });
  `;
  const blob = new Blob([swCode],{type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(err=>console.log('SW注册失败:',err));
}

navigate('dashboard');
