<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2D5BFF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="学情反馈" />
<title>学情反馈 · 老师端</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#F5F7FB;--card:#FFFFFF;--line:#E8ECF3;--text:#1B2230;--sub:#7A8497;
    --primary:#2D5BFF;--primary-soft:#E7EDFF;--green:#1FB47A;--red:#E5484D;
    --yellow:#FFB020;--shadow:0 2px 8px rgba(20,30,60,.06);
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);
    padding-bottom:calc(84px + env(safe-area-inset-bottom));position:relative;}
  header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between;}
  header.top h1{margin:0;font-size:18px;font-weight:600;}
  header.top .sub{font-size:12px;color:var(--sub);}
  main{padding:14px 14px 24px;}
  .card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);
    border:1px solid var(--line);margin-bottom:12px;}
  .card h3{margin:0 0 10px 0;font-size:15px;display:flex;align-items:center;gap:6px;}
  .card h3 .dot{width:6px;height:6px;background:var(--primary);border-radius:50%;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;
    padding:10px 16px;border-radius:10px;border:none;background:var(--primary);color:#fff;
    font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s;}
  .btn:active{opacity:.75;}
  .btn.secondary{background:var(--primary-soft);color:var(--primary);}
  .btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary);}
  .btn.sm{padding:6px 12px;font-size:13px;border-radius:8px;}
  .btn.block{width:100%;padding:12px;font-size:15px;}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;}
  .tag.gray{background:#EEF1F6;color:var(--sub);}
  .tag.green{background:#E2F8EE;color:var(--green);}
  .tag.yellow{background:#FFF4D6;color:#B67800;}
  .tag.red{background:#FFE5E7;color:var(--red);}
  .tag.primary{background:var(--primary-soft);color:var(--primary);}
  .list-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .list-item .top-line{display:flex;justify-content:space-between;align-items:center;}
  .list-item .name{font-weight:500;}
  .list-item .meta{font-size:12px;color:var(--sub);margin-top:2px;}
  .input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;font-size:14px;font-family:inherit;color:var(--text);
    outline:none;transition:border .15s;}
  .input:focus,select:focus,textarea:focus{border-color:var(--primary);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
  .mask{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:100;
    display:none;align-items:flex-end;justify-content:center;}
  .mask.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;
    padding:18px 16px 24px;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet h2{margin:0 0 4px 0;font-size:17px;}
  .sheet .sheet-sub{color:var(--sub);font-size:12px;margin-bottom:14px;}
  .sheet .grab{width:40px;height:4px;background:#D8DEEA;border-radius:2px;margin:-6px auto 12px;}
  .toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);
    background:rgba(20,25,40,.92);color:#fff;padding:10px 16px;border-radius:10px;
    font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .divider{height:1px;background:var(--line);margin:12px 0;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .empty{padding:30px 10px;text-align:center;color:var(--sub);font-size:13px;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:center;padding:6px 0 max(6px,env(safe-area-inset-bottom));
    z-index:60;max-width:520px;margin:0 auto;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:4px;color:var(--sub);font-size:11px;cursor:pointer;border:none;background:transparent;}
  .tab .ico svg{width:22px;height:22px;}
  .tab.active{color:var(--primary);font-weight:600;}
  .page{display:none;}
  .page.active{display:block;}
  .muted{color:var(--sub);font-size:12px;}
  .num{font-variant-numeric:tabular-nums;}

  /* Checkbox options */
  .check-group{display:flex;flex-direction:column;gap:8px;}
  .check-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .15s;
    background:#fff;}
  .check-row.on{border-color:var(--primary);background:var(--primary-soft);}
  .check-box{width:20px;height:20px;border:2px solid #D8DEEA;border-radius:5px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
  .check-row.on .check-box{border-color:var(--primary);background:var(--primary);}
  .check-box::after{content:"";display:none;width:5px;height:9px;border:solid #fff;
    border-width:0 2px 2px 0;transform:rotate(45deg);margin-bottom:2px;}
  .check-row.on .check-box::after{display:block;}
  .check-text{flex:1;font-size:14px;}

  /* Tone chips */
  .tones{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .tone{padding:5px 12px;border-radius:99px;font-size:13px;cursor:pointer;
    background:#EEF1F6;color:var(--sub);border:1px solid transparent;transition:.15s;}
  .tone.on{background:var(--primary);color:#fff;}

  /* Preview message */
  .preview-box{background:#F4F6FB;border:1px solid var(--line);border-radius:12px;
    padding:14px;font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;margin-top:12px;}
  .detail-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;}
  .detail-card .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .detail-card .date{font-size:13px;color:var(--sub);}
  .detail-card .content{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;}
  .tone-tag{padding:2px 8px;border-radius:99px;font-size:11px;background:var(--primary-soft);color:var(--primary);flex-shrink:0;}

  /* Table */
  .fb-table{width:100%;border-collapse:collapse;font-size:13px;}
  .fb-table th,.fb-table td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);}
  .fb-table th{font-size:11px;color:var(--sub);font-weight:500;background:#F9FAFC;}
  .fb-table tr:last-child td{border-bottom:none;}
  .fb-table .good{color:var(--green);font-weight:600;}
  .fb-table .warn{color:var(--yellow);font-weight:600;}
  .fb-table .bad{color:var(--red);font-weight:600;}
  .fb-table .na{color:var(--sub);}

  .link-box{background:var(--primary-soft);border:1px solid var(--primary);border-radius:10px;
    padding:12px;margin:8px 0;}
  .link-box .url{font-size:12px;word-break:break-all;color:var(--primary);font-family:monospace;}

  /* Assessment report */
  .assess-score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .assess-score .item{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;}
  .assess-score .item .lbl{font-size:12px;color:var(--sub);margin-bottom:4px;}
  .assess-score .item .val{font-size:18px;font-weight:600;color:var(--primary);}
  .assess-score .item .bar{height:4px;background:#EEF1F6;border-radius:2px;margin-top:6px;overflow:hidden;}
  .assess-score .item .bar-fill{height:100%;background:var(--primary);border-radius:2px;}
  .assess-section{margin-bottom:12px;}
  .assess-section .title{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
  .assess-section .body{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;
    background:#F4F6FB;border-radius:10px;padding:12px;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
  .btn.danger{background:var(--red);}
  .ai-loading{display:flex;align-items:center;gap:8px;color:var(--primary);font-size:14px;padding:12px;}
  .ai-loading .spin{width:16px;height:16px;border:2px solid var(--primary-soft);border-top-color:var(--primary);
    border-radius:50%;animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1>学情反馈</h1></div>
    <div class="sub">老师端</div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button class="tab active" data-page="dashboard">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12L12 3l9 9"/><path d="M5 10v10h14V10"/></svg></span>首页
    </button>
    <button class="tab" data-page="students">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>学生
    </button>
    <button class="tab" data-page="feedback">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>写反馈
    </button>
    <button class="tab" data-page="settings">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>设置
    </button>
  </nav>
</div>
<div class="mask" id="mask"><div class="sheet" id="sheet"><div class="grab"></div><div id="sheetContent"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const LS_KEY='solo_feedback_v2';
// GitHub API 配置 - 用仓库当云端数据库
const GH_OWNER='Douououououou';
const GH_REPO='solo-english-feedback';
const GH_FILE='data.json';
let GH_TOKEN=localStorage.getItem('gh_token')||''; // 老师输入后存 localStorage
let GH_API=`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

const Store={
  data:null,
  sha:null, // GitHub 文件的 sha，更新时需要
  loading:false,

  // 从 GitHub 加载数据
  async load(){
    // 如果没有 token，提示老师输入
    if(!GH_TOKEN){
      this.promptToken();
      return;
    }
    await this.fetchFromGitHub();
  },

  promptToken(){
    document.getElementById('main').innerHTML=`
      <div style="padding:30px 20px;">
        <div style="text-align:center;margin-bottom:20px;">
          <div style="font-size:36px;margin-bottom:8px;">🔑</div>
          <h2 style="margin:0 0 6px;">首次使用</h2>
          <p style="color:var(--sub);font-size:13px;margin:0;">请输入 GitHub Token 以连接云端存储</p>
        </div>
        <div class="field">
          <label>GitHub Personal Access Token</label>
          <input class="input" id="tokenInput" placeholder="github_pat_..." style="font-size:13px;letter-spacing:0;"/>
        </div>
        <button class="btn block" onclick="saveToken()">连接</button>
        <div style="font-size:12px;color:var(--sub);margin-top:12px;line-height:1.6;">
          Token 只会保存在本设备浏览器中，不会上传。<br/>
          家长端不需要 Token，可以正常查看。
        </div>
      </div>`;
  },

  async fetchFromGitHub(){
    // 先尝试 localStorage（离线缓存）
    try{
      const raw=localStorage.getItem(LS_KEY);
      if(raw){
        const cached=JSON.parse(raw);
        this.data=cached.data;
        this.sha=cached.sha;
      }
    }catch(e){}

    // 从 GitHub 拉取最新数据
    try{
      const resp=await fetch(GH_API,{
        headers:{
          'Authorization':`token ${GH_TOKEN}`,
          'Accept':'application/vnd.github+json',
        }
      });
      if(resp.ok){
        const json=await resp.json();
        this.sha=json.sha;
        this.data=JSON.parse(decodeURIComponent(escape(atob(json.content))));
        // 缓存到 localStorage
        localStorage.setItem(LS_KEY,JSON.stringify({data:this.data,sha:this.sha}));
        return;
      }else if(resp.status===401){
        // Token 失效
        U.toast('⚠️ Token已失效，请重新输入');
        GH_TOKEN='';
        localStorage.removeItem('gh_token');
        setTimeout(()=>this.promptToken(),1500);
        return;
      }else if(resp.status===404){
        // 仓库里还没有 data.json，用种子数据初始化
        if(!this.data){
          this.data=this.seed();
        }
        await this.save();
        return;
      }else{
        console.log('GitHub fetch failed:',resp.status);
      }
    }catch(e){console.log('GitHub fetch failed:',e);}

    // GitHub 没有数据，用种子数据
    if(!this.data){
      this.data=this.seed();
      await this.save();
    }
  },

  // 保存到 GitHub（异步，不阻塞UI）
  async save(){
    // 先更新本地缓存
    localStorage.setItem(LS_KEY,JSON.stringify({data:this.data,sha:this.sha}));
    
    // 推送到 GitHub（防抖：500ms内的多次保存只执行一次）
    if(this._saveTimer){clearTimeout(this._saveTimer);}
    this._saveTimer=setTimeout(async()=>{
      try{
        const content=btoa(unescape(encodeURIComponent(JSON.stringify(this.data))));
        const body={message:'update data',content};
        if(this.sha)body.sha=this.sha;
        
        const resp=await fetch(GH_API,{
          method:'PUT',
          headers:{
            'Authorization':`token ${GH_TOKEN}`,
            'Accept':'application/vnd.github+json',
            'Content-Type':'application/json',
          },
          body:JSON.stringify(body)
        });
        if(resp.ok){
          const json=await resp.json();
          this.sha=json.content.sha;
          localStorage.setItem(LS_KEY,JSON.stringify({data:this.data,sha:this.sha}));
          U.toast('✓ 已同步到云端');
        }else if(resp.status===401){
          // Token 失效
          U.toast('⚠️ Token已失效，请重新输入');
          GH_TOKEN='';
          localStorage.removeItem('gh_token');
          setTimeout(()=>this.promptToken(),1500);
        }else if(resp.status===409){
          // sha 冲突，需要重新拉取
          U.toast('⚠️ 数据版本冲突，正在同步...');
          await this.fetchFromGitHub();
        }else{
          const errText=await resp.text().catch(()=>'');
          console.log('GitHub save failed:',resp.status,errText);
          U.toast('⚠️ 同步失败('+resp.status+')，数据已保存在本地');
        }
      }catch(e){
        console.log('GitHub save failed:',e);
        U.toast('⚠️ 网络错误，数据已保存在本地');
      }
    },500);
  },

  seed(){
    const today=new Date();
    const ymd=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`;};
    const dPlus=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return ymd(d);};
    return {
      teacher:{name:'Tina老师',school:'独立英语工作室'},
      students:[],
      feedbacks:[],
    };
  }
};
// 异步加载数据
document.getElementById('main').innerHTML='<div style="padding:60px 20px;text-align:center;color:var(--sub);"><div style="font-size:36px;margin-bottom:12px;">⏳</div><div>正在加载...</div></div>';
Store.load().then(()=>{
  if(Store.data)navigate('dashboard');
}).catch(()=>{
  document.getElementById('main').innerHTML='<div style="padding:60px 20px;text-align:center;color:var(--sub);"><div style="font-size:36px;margin-bottom:12px;">⚠️</div><div>加载失败，请检查网络后刷新</div></div>';
});

function saveToken(){
  const t=document.getElementById('tokenInput').value.trim();
  if(!t){U.toast('请输入Token');return;}
  if(!t.startsWith('github_pat_')){U.toast('Token格式不正确');return;}
  GH_TOKEN=t;
  localStorage.setItem('gh_token',t);
  document.getElementById('main').innerHTML='<div style="padding:60px 20px;text-align:center;color:var(--sub);"><div style="font-size:36px;margin-bottom:12px;">⏳</div><div>正在连接云端...</div></div>';
  Store.fetchFromGitHub().then(()=>{
    if(Store.data)navigate('dashboard');
  });
}

const getD=()=>Store.data;

const U={
  id:()=>Math.random().toString(36).slice(2,9),
  token:()=>Math.random().toString(36).slice(2,18),
  fmtDate:s=>{if(!s)return'-';const d=new Date(s);return`${d.getMonth()+1}月${d.getDate()}日`;},
  ymd:d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`;},
  todayYmd(){return U.ymd(new Date());},
  weekday:s=>{const d=new Date(s);return['日','一','二','三','四','五','六'][d.getDay()];},
  toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);},
  escape(s){return(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
};

const getStudent=id=>Store.data.students.find(s=>s.id===id);
const getStudentFeedbacks=sid=>Store.data.feedbacks.filter(f=>f.studentId===sid).sort((a,b)=>b.date.localeCompare(a.date));

// D 作为 Store.data 的快捷引用（在页面渲染时动态获取）
const D=new Proxy({},{get(t,k){return Store.data[k];},set(t,k,v){Store.data[k]=v;return true;}});

// 话术生成器
const TONE_TEMPLATES={
  '专业':{prefix:'',style:'客观、数据化'},
  '温和':{prefix:'',style:'亲切、鼓励为主'},
  '严厉':{prefix:'',style:'直接指出问题，要求改进'},
  '幽默':{prefix:'',style:'轻松、带点小调侃'},
  '文艺':{prefix:'',style:'优美、有文采'},
  '学术':{prefix:'',style:'专业术语、分析深入'},
  '安抚':{prefix:'',style:'安慰、减轻焦虑'},
  '阳光':{prefix:'',style:'积极、充满正能量'},
  '警醒':{prefix:'',style:'提醒、引起重视'},
  '表扬':{prefix:'',style:'大力肯定、激励'},
  '礼貌':{prefix:'',style:'正式、客气'},
};

function generateMessage(name,parentName,lesson,homeworkDone,homeworkDetail,attentive,participated,tone,note,dictation,quiz,assessment){
  const p=parentName||'家长';
  const t=TONE_TEMPLATES[tone]||TONE_TEMPLATES['温和'];
  let msg=`${p}您好！今天${name}的${lesson}课程反馈如下：\n\n`;

  // 作业
  if(homeworkDone){
    msg+='✅ 课后作业：已完成\n';
  }else{
    msg+='⚠️ 课后作业：未完成，请督促完成\n';
  }
  // 作业完成情况描述
  if(homeworkDetail){
    msg+=`📝 作业情况：${homeworkDetail}\n`;
  }

  // 认真
  if(attentive){
    msg+='✅ 上课状态：认真听讲，专注度高\n';
  }else{
    msg+='⚠️ 上课状态：偶有走神，需要提醒\n';
  }

  // 互动
  if(participated){
    msg+='✅ 课堂互动：积极参与，表现活跃\n';
  }else{
    msg+='⚠️ 课堂互动：参与度不高，建议多鼓励开口\n';
  }

  // 测评（有填才显示）
  const examParts=[];
  if(dictation) examParts.push(`听写：${dictation}`);
  if(quiz) examParts.push(`小测：${quiz}`);
  if(assessment) examParts.push(`阶段测评：${assessment}`);
  if(examParts.length>0){
    msg+=`\n📊 测评成绩：${examParts.join(' · ')}\n`;
  }

  if(note){
    msg+=`\n💡 补充说明：${note}\n`;
  }

  // 根据语气加结尾
  const endings={
    '专业':`\n以上为本节课的客观反馈，如有疑问欢迎沟通。`,
    '温和':`\n整体来看${name}今天表现不错，继续加油！有任何问题随时联系我。`,
    '严厉':`\n以上问题请家长引起重视，配合督促改进。`,
    '幽默':`\n${name}今天又是元气满满的一天！虽然有小插曲，但总体在线～`,
    '文艺':`\n教育是一场温柔的坚持，相信${name}会在点滴进步中绽放光芒。`,
    '学术':`\n从认知发展角度看，${name}当前处于语言习得的黄金期，建议保持高频输入。`,
    '安抚':`\n每个孩子的学习节奏不同，${name}正在以自己的方式进步，请多给一些耐心。`,
    '阳光':`\n${name}今天超棒！每一份努力都在为未来铺路，继续闪闪发光吧！`,
    '警醒':`\n当前阶段较为关键，建议家长密切关注${name}的学习状态，及时调整。`,
    '表扬':`\n${name}今天简直不要太优秀！必须大力表扬，继续保持这个状态！`,
    '礼貌':`\n感谢您对孩子学习的关注，期待家校共同努力，助力${name}成长。`,
  };
  msg+=endings[tone]||endings['温和'];
  return msg;
}

/* ============== Routing ============== */
let currentPage='dashboard';
let currentTone='温和';
function navigate(p){
  currentPage=p;
  document.getElementById('main').innerHTML=Pages[p]();
  [...document.querySelectorAll('.tab')].forEach(t=>t.classList.toggle('active',t.dataset.page===p));
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>navigate(t.dataset.page)));

function openSheet(html){document.getElementById('sheetContent').innerHTML=html;document.getElementById('mask').classList.add('show');}
function closeSheet(){document.getElementById('mask').classList.remove('show');}
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')closeSheet();});

/* ============== Checkboxes ============== */
function toggleCheck(id){
  const el=document.getElementById(id);
  el.classList.toggle('on');
}
function selectTone(el){
  document.querySelectorAll('#toneContainer .tone').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  currentTone=el.dataset.tone;
}

/* ============== Generate & Save ============== */
let lastGenerated='';
function generatePreview(){
  const sid=document.getElementById('fbStudent').value;
  const s=getStudent(sid);
  const date=document.getElementById('fbDate').value;
  const lesson=document.getElementById('fbLesson').value.trim()||'英语课';
  const homeworkDone=document.getElementById('chkHomework').classList.contains('on');
  const homeworkDetail=document.getElementById('fbHomeworkDetail').value.trim();
  const attentive=document.getElementById('chkAttentive').classList.contains('on');
  const participated=document.getElementById('chkParticipated').classList.contains('on');
  const note=document.getElementById('fbNote').value.trim();
  const dictation=document.getElementById('fbDictation').value.trim();
  const quiz=document.getElementById('fbQuiz').value.trim();
  const assessment=document.getElementById('fbAssessment').value.trim();

  lastGenerated=generateMessage(s.name,s.parentName,lesson,homeworkDone,homeworkDetail,attentive,participated,currentTone,note,dictation,quiz,assessment);
  document.getElementById('generatedText').textContent=lastGenerated;
  document.getElementById('previewArea').style.display='block';
  window.scrollTo(0,document.body.scrollHeight);
}
function copyGenerated(){
  if(!lastGenerated)return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(lastGenerated).then(()=>U.toast('已复制'));
  }else{
    const ta=document.createElement('textarea');ta.value=lastGenerated;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');U.toast('已复制');}catch(e){}
    document.body.removeChild(ta);
  }
}
function saveGeneratedFeedback(){
  const sid=document.getElementById('fbStudent').value;
  const date=document.getElementById('fbDate').value;
  const lesson=document.getElementById('fbLesson').value.trim()||'英语课';
  const homeworkDone=document.getElementById('chkHomework').classList.contains('on');
  const homeworkDetail=document.getElementById('fbHomeworkDetail').value.trim();
  const attentive=document.getElementById('chkAttentive').classList.contains('on');
  const participated=document.getElementById('chkParticipated').classList.contains('on');
  const note=document.getElementById('fbNote').value.trim();
  const dictation=document.getElementById('fbDictation').value.trim();
  const quiz=document.getElementById('fbQuiz').value.trim();
  const assessment=document.getElementById('fbAssessment').value.trim();

  D.feedbacks.push({
    id:U.id(),studentId:sid,date,lesson,
    homeworkDone,homeworkDetail,attentive,participated,
    tone:currentTone,note,dictation,quiz,assessment,
    generated:lastGenerated,
    createdAt:U.todayYmd()
  });
  Store.save();
  U.toast('反馈已保存');
  navigate('dashboard');
}

const ASSESS_FIELDS=[
  {key:'reading',label:'阅读',icon:'📖'},
  {key:'listening',label:'听力',icon:'👂'},

// 通用：解析分数输入（支持 "15/20" 或 "85"）
function parseScore(raw){
  raw=(raw||'').trim();
  if(!raw)return NaN;
  if(raw.includes('/')){
    const parts=raw.split('/');
    if(parts.length===2){
      const num=parseFloat(parts[0]);
      const den=parseFloat(parts[1]);
      if(den>0&&!isNaN(num))return Math.round(num/den*100);
    }
    return NaN;
  }
  return parseFloat(raw);
}

// 通用：读取表单数据
function readAssessForm(){
  const date=document.getElementById('aDate').value;
  const overall=document.getElementById('aOverall').value;
  const comment=document.getElementById('aComment').value.trim();
  const scores={};
  let allFilled=true;
  ASSESS_FIELDS.forEach(f=>{
    const v=parseScore(document.getElementById('a_'+f.key).value);
    if(isNaN(v))allFilled=false;
    scores[f.key]=v||0;
  });
  return {date,overall,comment,scores,allFilled};
}

function buildAssessmentAnalysis(name,scores,overall,comment,type){
  const sorted=ASSESS_FIELDS.map(f=>({label:f.label,icon:f.icon,score:scores[f.key]})).sort((a,b)=>b.score-a.score);
  const top2=sorted.slice(0,2);
  const bottom2=sorted.slice(-2).reverse();
  const avg=Math.round(sorted.reduce((s,f)=>s+f.score,0)/sorted.length);
  const isStage=type==='stage';

  let text='';

  // 优势分析
  text+=(isStage?'🌟 本阶段优势：\n':'🌟 优势分析：\n');
  top2.forEach(f=>{
    let desc='';
    if(f.label==='阅读')desc='阅读理解能力较强，能较好地理解英文文本主旨和细节';
    else if(f.label==='听力')desc='听力理解能力良好，能准确捕捉关键信息';
    else if(f.label==='口语')desc='口语表达流畅，敢于开口，语音语调自然';
    else if(f.label==='写作')desc='写作基础扎实，句子结构基本正确，能独立完成短文写作';
    else if(f.label==='词汇')desc='词汇量储备较好，能灵活运用所学词汇';
    else if(f.label==='语法')desc='语法知识点掌握扎实，句式运用规范';
    text+=`${f.icon} ${f.label}（${f.score}分）：${desc}。\n`;
  });

  // 不足之处
  text+='\n⚠️ 不足之处：\n';
  bottom2.forEach(f=>{
    let desc='';
    if(f.label==='阅读')desc='阅读速度和细节理解有待提升，建议增加课外阅读量';
    else if(f.label==='听力')desc='听力反应速度需加强，建议每天坚持10-15分钟听力练习';
    else if(f.label==='口语')desc='口语表达是当前相对薄弱环节，开口信心不足，建议多进行朗读和复述练习';
    else if(f.label==='写作')desc='写作能力有待提升，建议加强句子结构练习和短文仿写';
    else if(f.label==='词汇')desc='词汇量有待扩充，建议每天坚持积累5-8个新词';
    else if(f.label==='语法')desc='语法知识点掌握不够牢固，建议系统梳理重点语法并进行专项练习';
    text+=`${f.icon} ${f.label}（${f.score}分）：${desc}。\n`;
  });

  // 老师补充评语
  if(comment){
    text+=`\n📝 老师评语：${comment}\n`;
  }

  // 学习目标
  text+=(isStage?'\n🎯 下阶段目标：\n':'\n🎯 学习目标：\n');
  const weakest=bottom2[0];
  const weakestGoals={
    '阅读':'提升阅读理解速度和准确率，每周完成2-3篇英文短文阅读',
    '听力':'提升听力反应速度，每天坚持10-15分钟听力训练',
    '口语':'提升口语表达信心，课堂主动发言次数增加50%',
    '写作':'提升写作能力，每周完成1-2篇短文写作练习',
    '词汇':'扩充词汇量至课程要求水平，每天积累5-8个新词',
    '语法':'系统掌握重点语法知识，时态运用正确率达到85%以上',
  };
  text+=`1. 短期目标（1个月）：${weakestGoals[weakest.label]||'针对薄弱项专项提升'}\n`;

  const secondWeak=bottom2[1]||bottom2[0];
  const secondGoals={
    '阅读':'阅读理解正确率提升至85%以上',
    '听力':'听力测试正确率达到80%以上',
    '口语':'能流利复述课文内容，主动参与课堂对话',
    '写作':'能独立完成50词以上的短文，语法错误减少50%',
    '词汇':'掌握课程核心词汇，拼写正确率达到90%',
    '语法':'语法时态正确率达到85%以上，能准确运用基本句型',
  };
  text+=`2. 中期目标（2个月）：${secondGoals[secondWeak.label]||'各项能力均衡发展'}\n`;

  const overallGoals={
    'A':'保持优秀水平，挑战更高难度，拓展课外英语能力',
    'B':'达到课程优秀标准，各项能力均衡发展，为下一阶段学习打好基础',
    'C':'全面提升英语综合能力，重点突破薄弱环节，争取达到B级水平',
    'D':'夯实基础，重点提升薄弱项，逐步建立学习信心和兴趣',
  };
  text+=(isStage?'3. 长期目标：':'3. 长期目标：')+(overallGoals[overall]||overallGoals['B']);

  return text;
}

      <button class="btn ghost block" onclick="resetStudentToken('${id}')">重新生成链接</button>
    </div>
    <div style="margin-top:14px;">
      <div style="font-size:12px;color:var(--sub);margin-bottom:6px;">👇 如果上面的按钮复制不成功，长按下方文字框全选复制：</div>
      <textarea readonly style="width:100%;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:8px;min-height:80px;font-family:inherit;" onclick="this.select()">${fullText}</textarea>
    </div>
  `);
}
function copyLink(id){
  const s=getStudent(id);
  const linkUrl=`https://douououououou.github.io/solo-english-feedback/parent-view.html?v=3&token=${s.token}`;
  const text=`${s.name}的学情反馈链接：\n${linkUrl}\n查看密码：${s.password}`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>U.toast('✓ 已复制，去粘贴给家长')).catch(()=>fallbackCopy(text));
  }else{fallbackCopy(text);}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');U.toast('✓ 已复制，去粘贴给家长');}catch(e){U.toast('复制失败，请长按下方文字框手动复制');}
  document.body.removeChild(ta);
}
function resetStudentToken(id){
  if(!confirm('重新生成链接后，旧链接将失效。继续？'))return;
  const s=getStudent(id);s.token=U.token();Store.save();closeSheet();openShareLink(id);U.toast('已生成新链接');
}

/* ============== Teacher ============== */
function saveTeacher(){
  D.teacher.name=document.getElementById('teacherName').value.trim();
  D.teacher.school=document.getElementById('teacherSchool').value.trim();
  Store.save();U.toast('已保存');
}
function exportData(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`学情反馈_${U.todayYmd()}.json`;a.click();
}
function confirmReset(){
  if(!confirm('重置为示例数据？当前数据将丢失'))return;
  Store.reset();navigate('dashboard');U.toast('已重置');
}

/* ============== Init ============== */
navigate('dashboard');
</script>
</body>
</html>
